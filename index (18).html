<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenoo Cloud // Premium Storage Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060b18;
            --bg-container: #0d1527;
            --bg-card: rgba(21, 33, 61, 0.6);
            --border-neon: rgba(56, 189, 248, 0.15);
            --cyan-neon: #38bdf8;
            --blue-deep: #1d4ed8;
            --text-main: #f0fdfa;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-y: auto;
            padding: 20px;
        }

        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .loader-text {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--cyan-neon);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            margin-bottom: 20px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .loader-bar {
            width: 160px;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: var(--cyan-neon);
            position: absolute;
            animation: load 1.2s forwards cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--bg-container);
            border: 1px solid var(--border-neon);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(56, 189, 248, 0.03);
            margin-bottom: 40px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .banner {
            width: 100%;
            height: 160px;
            background: linear-gradient(180deg, rgba(29, 78, 216, 0.5) 0%, rgba(13, 21, 39, 1) 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            overflow: hidden;
        }

        .banner::before {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
            filter: blur(15px);
            animation: aurora 6s infinite ease-in-out;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--cyan-neon);
            margin-top: 2px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-bar {
            background-color: rgba(6, 11, 24, 0.5);
            border-bottom: 1px solid var(--border-neon);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .status-item span {
            color: var(--cyan-neon);
            font-weight: 600;
        }

        .main-content {
            padding: 24px;
        }

        .storage-card {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .storage-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .bar-container {
            width: 100%;
            height: 8px;
            background: rgba(6, 11, 24, 0.8);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--blue-deep), var(--cyan-neon));
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: barGleam 2s infinite linear;
        }

        .storage-footer {
            font-size: 12px;
            color: var(--text-muted);
        }

        .storage-footer strong {
            color: var(--cyan-neon);
        }

        .upload-zone {
            border: 2px dashed var(--border-neon);
            background: rgba(56, 189, 248, 0.01);
            border-radius: 16px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 28px;
            animation: floatZone 4s infinite ease-in-out;
        }

        .upload-zone:hover {
            border-color: var(--cyan-neon);
            background: rgba(56, 189, 248, 0.04);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.05);
        }

        .upload-icon {
            font-size: 32px;
            color: var(--cyan-neon);
            margin-bottom: 8px;
            display: inline-block;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }

        .upload-zone p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .upload-zone p strong {
            color: var(--cyan-neon);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .file-card {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 105px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: cardEntrance 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(15px) scale(0.95);
        }

        .file-card:hover {
            border-color: var(--cyan-neon);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.12);
            background: rgba(21, 33, 61, 0.8);
        }

        .file-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .file-ext {
            font-size: 10px;
            font-weight: 700;
            color: var(--cyan-neon);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .file-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        .file-size {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .file-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-action {
            background: rgba(6, 11, 24, 0.6);
            border: 1px solid var(--border-neon);
            color: var(--text-main);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-download:hover {
            background: var(--cyan-neon);
            color: var(--bg-dark);
            border-color: var(--cyan-neon);
            transform: scale(1.08);
        }

        .btn-delete:hover {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
            transform: scale(1.08);
        }

        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1); } }
        @keyframes load { 100% { width: 100%; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        @keyframes aurora {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-15px, 10px) scale(1.15); filter: blur(20px); }
        }

        @keyframes barGleam {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes floatZone {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); border-color: rgba(56, 189, 248, 0.3); }
        }

        @keyframes cardEntrance {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="loader-text">KENOO CLOUD</div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <div class="app-container">
        <div class="banner">
            <div class="brand-title">Kenoo Cloud</div>
            <div class="brand-subtitle">Secured Hub Storage</div>
        </div>

        <div class="status-bar">
            <div class="status-item">Region: <span>ID</span></div>
            <div class="status-item">Client: <span>Web Engine</span></div>
            <div class="status-item">System: <span>Online</span></div>
        </div>

        <div class="main-content">
            <div class="storage-card">
                <div class="storage-header">
                    <span>Kapasitas Penyimpanan</span>
                    <span id="storagePercent">0%</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill" id="storageBar"></div>
                </div>
                <div class="storage-footer">
                    Terpakai <strong id="storageUsed">0.00 MB</strong> dari <strong>10.00 GB</strong>
                </div>
            </div>

            <div class="upload-zone" id="dropZone">
                <div class="upload-icon">✦</div>
                <p><strong>Pilih Berkas</strong> atau Drop ke Sini</p>
                <input type="file" id="hiddenFileInput" style="display: none;" multiple>
            </div>

            <div class="section-title">Berkas Tersimpan</div>
            <div class="file-grid" id="fileGrid"></div>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            setTimeout(() => {
                preloader.style.opacity = '0';
                setTimeout(() => preloader.style.visibility = 'hidden', 500);
            }, 1200); 
        });

        const MAX_STORAGE_BYTES = 10 * 1024 * 1024 * 1024;
        let usedBytes = 0; 
        let filesDatabase = []; 

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('hiddenFileInput');
        const fileGrid = document.getElementById('fileGrid');
        const storageUsedText = document.getElementById('storageUsed');
        const storagePercentText = document.getElementById('storagePercent');
        const storageBar = document.getElementById('storageBar');

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            for (let file of files) {
                if (usedBytes + file.size > MAX_STORAGE_BYTES) {
                    alert(`Gagal! Ukuran berkas "${file.name}" melewati sisa kuota penyimpanan.`);
                    continue;
                }

                const fileId = Date.now() + Math.random().toString(36).substr(2, 5);
                const fileBlobUrl = URL.createObjectURL(file);
                
                filesDatabase.push({
                    id: fileId,
                    name: file.name,
                    size: file.size,
                    blobUrl: fileBlobUrl
                });

                usedBytes += file.size;
                renderUI();
            }
        }

        function deleteFile(id) {
            const fileIndex = filesDatabase.findIndex(f => f.id === id);
            if (fileIndex !== -1) {
                URL.revokeObjectURL(filesDatabase[fileIndex].blobUrl);
                usedBytes -= filesDatabase[fileIndex].size;
                filesDatabase.splice(fileIndex, 1);
                renderUI();
            }
        }

        function renderUI() {
            const percentage = (usedBytes / MAX_STORAGE_BYTES) * 100;
            storageBar.style.width = `${percentage}%`;
            storagePercentText.innerText = `${percentage.toFixed(1)}%`;

            if (usedBytes >= 1024 * 1024 * 1024) {
                storageUsedText.innerText = `${(usedBytes / (1024 * 1024 * 1024)).toFixed(2)} GB`;
            } else {
                storageUsedText.innerText = `${(usedBytes / (1024 * 1024)).toFixed(2)} MB`;
            }

            fileGrid.innerHTML = '';
            filesDatabase.forEach(file => {
                const extension = file.name.split('.').pop().toUpperCase().substring(0, 4) || 'FILE';
                
                let displaySize = file.size >= 1024 * 1024 * 1024 ? 
                    (file.size / (1024 * 1024 * 1024)).toFixed(2) + " GB" : 
                    (file.size / (1024 * 1024)).toFixed(1) + " MB";

                const card = document.createElement('div');
                card.className = 'file-card';
                card.innerHTML = `
                    <div class="file-info">
                        <span class="file-ext">${extension}</span>
                        <div class="file-name" title="${file.name}">${file.name}</div>
                        <div class="file-size">${displaySize}</div>
                    </div>
                    <div class="file-actions">
                        <a href="${file.blobUrl}" download="${file.name}" class="btn-action btn-download" title="Unduh Berkas">↓</a>
                        <button onclick="deleteFile('${file.id}')" class="btn-action btn-delete" title="Hapus Berkas">×</button>
                    </div>
                `;
                fileGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
